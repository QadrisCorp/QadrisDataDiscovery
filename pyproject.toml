[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qadris-datasourcediscovery"
version = "0.1.0"
description = "Financial data source discovery and cataloging tool"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.2",
    "selenium>=4.18",
    "webdriver-manager>=4.0",
    "lxml>=5.1",
    "html5lib>=1.1",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
qadris-discovery = "qadris_datasourcediscovery.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qadris_datasourcediscovery"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.9",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
